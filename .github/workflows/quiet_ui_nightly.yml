# Builds the quiet-ui branch on a schedule.
#
# This file lives on the default branch because GitHub runs scheduled workflows
# only from there, which is why the equivalent `schedule:` cannot go in the copy
# of quiet_ui_build.yml that lives on quiet-ui. It checks out quiet-ui and
# builds that; nothing here builds main.
#
# It exists because the nightly rebase routine cannot reliably ask for a build
# itself: `gh` is not authenticated in its sandbox, so its dispatch step fails
# silently and the branch gets rebased with no dmg to show for it. A schedule
# needs nothing from the routine.
#
# The hour is set by what happens either side of it. The rebase routine starts
# at 22:15 UTC and takes about two hours, the bundle takes another two and a
# bit, and GitHub's scheduler is not punctual: a run asked for at 02:30 once
# started at 05:33, which is how a dmg meant for breakfast arrived at 09:43
# local. Starting at 00:45 absorbs that delay and still lands before morning.
name: quiet-ui nightly build

on:
  schedule:
    - cron: "45 0 * * 1-5"
  workflow_dispatch:

concurrency:
  group: quiet-ui-build
  cancel-in-progress: false

jobs:
  bundle-mac:
    runs-on: macos-15
    timeout-minutes: 300
    permissions:
      # For the marker tag written at the end.
      contents: write
    env:
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: quiet-ui
          fetch-depth: 1

      # `quiet-ui-built` marks the commit the last successful bundle came from.
      # A night where the routine found nothing to do, or a day already built by
      # hand, leaves the branch on that commit, and rebuilding it would spend
      # two hours of a runner on an identical dmg. Comparing commits rather than
      # timestamps means a manual build earlier in the day also counts. Asking
      # for a run by hand always builds: that is what asking means.
      - id: freshness
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          head=$(git rev-parse HEAD)
          built=$(git ls-remote origin refs/tags/quiet-ui-built | cut -f1)
          if [ "$head" = "$built" ]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "quiet-ui is unchanged since the last build; skipping" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.freshness.outputs.build == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - if: steps.freshness.outputs.build == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: quiet-ui
          workspaces: ". -> target"

      - name: Bundle
        if: steps.freshness.outputs.build == 'true'
        run: ./script/bundle-mac aarch64-apple-darwin

      - if: steps.freshness.outputs.build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Zed-quiet-ui-aarch64
          path: target/aarch64-apple-darwin/release/Zed-aarch64.dmg
          if-no-files-found: error
          retention-days: 7

      # An artifact is a poor place to keep the thing you actually want to
      # install: it needs a GitHub login, it arrives zipped, and it expires
      # after a week. A release at a fixed tag is one public URL that always
      # points at last night's build:
      #
      #   https://github.com/ArthurBrussee/zed/releases/download/quiet-ui-latest/Zed-quiet-ui.dmg
      #
      # The release is replaced rather than added to, so the tag follows the
      # commit that was built and the link never changes.
      - name: Publish the build
        if: steps.freshness.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp target/aarch64-apple-darwin/release/Zed-aarch64.dmg Zed-quiet-ui.dmg
          # What the app's own updater reads. It needs two things: the commit
          # this dmg came from, which is the only way to tell a new build from
          # the running one (the version number never moves), and where the dmg
          # is. A plain asset rather than the GitHub API: no token, no rate
          # limit, and nothing to get right about user agents.
          cat > quiet-ui-latest.json <<JSON
          {
            "sha": "$(git rev-parse HEAD)",
            "url": "https://github.com/$GITHUB_REPOSITORY/releases/download/quiet-ui-latest/Zed-quiet-ui.dmg",
            "built_at": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          }
          JSON
          cat > notes.md <<NOTES
          Built from \`quiet-ui\` at $(git rev-parse --short HEAD), $(date -u +'%Y-%m-%d %H:%M') UTC.

          Download **Zed-quiet-ui.dmg** below, open it, and drag **Zed Dev** to
          Applications, replacing the copy already there. It installs alongside a
          normal Zed rather than over it.

          The build is unsigned, so the first launch is refused: macOS says it
          cannot verify the developer. Open **System Settings > Privacy &
          Security**, scroll to Security, and press **Open Anyway**. That is once
          per machine, not once per update.

          After that the app updates itself. It checks this release, offers the
          new build in the app, and installs it when you say so.

          Apple silicon only.
          NOTES
          gh release delete quiet-ui-latest --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create quiet-ui-latest Zed-quiet-ui.dmg quiet-ui-latest.json \
            --repo "$GITHUB_REPOSITORY" \
            --target "$(git rev-parse HEAD)" \
            --title "quiet-ui $(date -u +%Y-%m-%d)" \
            --notes-file notes.md

      # Only once the artifact exists: a failed bundle must leave the marker
      # where it was, so the next night tries the same commit again.
      - name: Mark this commit as built
        if: steps.freshness.outputs.build == 'true'
        run: git push --force origin "HEAD:refs/tags/quiet-ui-built"
