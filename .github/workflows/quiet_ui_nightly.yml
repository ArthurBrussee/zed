# Builds the quiet-ui branch: the macOS dmg and the Linux remote servers,
# published to the quiet-ui-latest release that the app's updater reads.
#
# It runs only when dispatched. The nightly routine's push to quiet-ui is what
# dispatches it, through quiet_ui_kick.yml on that branch, so each routine run
# that pushes code gets exactly one build, whenever it finishes. A push that
# only edits QUIET_UI.md dispatches nothing. Anyone can also dispatch it by hand.
#
# It lives on the default branch so there is one copy of it; it checks out
# quiet-ui and builds that, never main.
name: quiet-ui nightly build

on:
  workflow_dispatch:

concurrency:
  group: quiet-ui-build
  cancel-in-progress: false

jobs:
  # The commit every job builds, read once. Jobs that check out `quiet-ui`
  # themselves can each see a different tip, and a re-run of one failed job
  # would build whatever the branch points at by then: on 2026-10-22 that left a
  # dmg and remote servers from different commits, and the app could not connect.
  # A re-run reuses this job's output, so it builds the same commit.
  resolve:
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.tip.outputs.sha }}
    steps:
      - id: tip
        run: echo "sha=$(git ls-remote https://github.com/$GITHUB_REPOSITORY refs/heads/quiet-ui | cut -f1)" >> "$GITHUB_OUTPUT"

  bundle-mac:
    needs: resolve
    # Upstream needs the macOS 26 SDK (since its gpui_macos objc2 move, 10-22); the
    # macos-15 image's default Xcode 16.4 only has the 15.5 SDK.
    runs-on: macos-26
    timeout-minutes: 300
    permissions:
      # For the marker tag written at the end.
      contents: write
    env:
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 1

      - name: Select the newest Xcode 26
        run: |
          xcode=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$xcode" ]; then sudo xcode-select -s "$xcode"; fi
          xcode-select -p
          xcrun --sdk macosx --show-sdk-version

      # `quiet-ui-built` marks the commit the last successful bundle came from.
      # A night where the routine found nothing to do, or a day already built by
      # hand, leaves the branch on that commit, and rebuilding it would spend
      # two hours of a runner on an identical dmg. Comparing commits rather than
      # timestamps means a manual build earlier in the day also counts. Asking
      # for a run by hand always builds: that is what asking means.
      - id: freshness
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          head=$(git rev-parse HEAD)
          built=$(git ls-remote origin refs/tags/quiet-ui-built | cut -f1)
          if [ "$head" = "$built" ]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "quiet-ui is unchanged since the last build; skipping" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.freshness.outputs.build == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      # Runs BEFORE the cache is restored, because restoring it is what runs out
      # of room: on 2026-09-01 two runs died six minutes in with no failed step
      # and no logs, which is a lost runner, not a build error. A release build
      # of the whole workspace plus the restored target directory does not fit
      # otherwise. None of what this removes is used to bundle a macOS Zed, and
      # the active Xcode is left alone.
      - name: Make room on the runner
        if: steps.freshness.outputs.build == 'true'
        run: |
          df -h / | tail -1
          # Compare real paths: on macos-26 the Xcode_26.x.y.app names are symlinks
          # to differently named apps, and comparing names deleted the active one.
          active=$(cd "$(xcode-select -p)/../.." && pwd -P)
          echo "keeping $active"
          for app in /Applications/Xcode*.app; do
            [ -L "$app" ] && continue
            [ "$(cd "$app" && pwd -P)" = "$active" ] && continue
            sudo rm -rf "$app" || true
          done
          xcode-select -p
          sudo rm -rf /Library/Developer/CoreSimulator/Profiles/Runtimes/* || true
          sudo rm -rf ~/Library/Developer/CoreSimulator/Caches || true
          df -h / | tail -1

      # No build cache. Restoring one was killing the runner outright: two runs
      # on 2026-09-01 died six minutes in with no failed step and no logs, and
      # a cache big enough to hold a release build of this workspace does not
      # fit alongside the build that reads it. A cold build takes longer than a
      # warm one and finishes, which is the trade that matters for a nightly
      # nobody is watching.

      - name: Bundle
        if: steps.freshness.outputs.build == 'true'
        # Xcode 26 ships the Metal compiler as a separate component, mounted from
        # a cryptex; fetched earlier it was gone by the time gpui's build script
        # compiled its shaders (10-27), so it is fetched here, right before.
        run: |
          xcrun -f metal >/dev/null 2>&1 || xcodebuild -downloadComponent MetalToolchain
          xcrun -f metal
          xcrun -sdk macosx metal --version
          ./script/bundle-mac aarch64-apple-darwin

      - if: steps.freshness.outputs.build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Zed-quiet-ui-aarch64
          path: target/aarch64-apple-darwin/release/Zed-aarch64.dmg
          if-no-files-found: error
          retention-days: 7

      # An artifact is a poor place to keep the thing you actually want to
      # install: it needs a GitHub login, it arrives zipped, and it expires
      # after a week. A release at a fixed tag is one public URL that always
      # points at last night's build:
      #
      #   https://github.com/ArthurBrussee/zed/releases/download/quiet-ui-latest/Zed-quiet-ui.dmg
      #
      # The release is replaced rather than added to, so the tag follows the
      # commit that was built and the link never changes.
      - name: Publish the build
        if: steps.freshness.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp target/aarch64-apple-darwin/release/Zed-aarch64.dmg Zed-quiet-ui.dmg
          # What the app's own updater reads. It needs two things: the commit
          # this dmg came from, which is the only way to tell a new build from
          # the running one (the version number never moves), and where the dmg
          # is. A plain asset rather than the GitHub API: no token, no rate
          # limit, and nothing to get right about user agents.
          cat > quiet-ui-latest.json <<JSON
          {
            "sha": "$(git rev-parse HEAD)",
            "url": "https://github.com/$GITHUB_REPOSITORY/releases/download/quiet-ui-latest/Zed-quiet-ui.dmg",
            "built_at": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          }
          JSON
          cat > notes.md <<NOTES
          Built from \`quiet-ui\` at $(git rev-parse --short HEAD), $(date -u +'%Y-%m-%d %H:%M') UTC.

          Download **Zed-quiet-ui.dmg** below, open it, and drag **Zed Dev** to
          Applications, replacing the copy already there. It installs alongside a
          normal Zed rather than over it.

          The build is unsigned, so the first launch is refused: macOS says it
          cannot verify the developer. Open **System Settings > Privacy &
          Security**, scroll to Security, and press **Open Anyway**. That is once
          per machine, not once per update.

          After that the app updates itself. It checks this release, offers the
          new build in the app, and installs it when you say so.

          Apple silicon only.
          NOTES
          # Never delete before creating. A failure between the two leaves no
          # release at all, which takes out the in-app updater and
          # install-quiet-ui together: both read this tag. That happened on
          # 2026-08-21, when the create came back 403 after the delete had
          # already succeeded. Replacing the assets in place leaves the previous
          # build standing if anything here fails.
          if ! gh release view quiet-ui-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create quiet-ui-latest \
              --repo "$GITHUB_REPOSITORY" \
              --target "$(git rev-parse HEAD)" \
              --title "quiet-ui $(date -u +%Y-%m-%d)" \
              --notes-file notes.md
          fi
          gh release upload quiet-ui-latest Zed-quiet-ui.dmg quiet-ui-latest.json \
            --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit quiet-ui-latest \
            --repo "$GITHUB_REPOSITORY" \
            --title "quiet-ui $(date -u +%Y-%m-%d)" \
            --notes-file notes.md

      # Only once the artifact exists: a failed bundle must leave the marker
      # where it was, so the next night tries the same commit again.
      - name: Mark this commit as built
        if: steps.freshness.outputs.build == 'true'
        run: git push --force origin "HEAD:refs/tags/quiet-ui-built"

  # The half of Zed that runs on a dev box over SSH. A client looks for a
  # server built from its own commit, so every build that ships a dmg also
  # ships these, under fixed names, with the commit they came from beside them.
  # Separate from the mac job so a failure here never costs the dmg.
  remote-server:
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: write
    env:
      CARGO_INCREMENTAL: 0
      ASSET: zed-remote-server-linux-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 1

      # Skip a commit this arch already has a server for, unless asked by hand.
      - id: freshness
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head=$(git rev-parse HEAD)
          echo "sha=$head" >> "$GITHUB_OUTPUT"
          built=$(gh release download quiet-ui-latest --repo "$GITHUB_REPOSITORY" \
            --pattern "$ASSET.json" --output - 2>/dev/null | jq -r .sha 2>/dev/null || true)
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] && [ "$head" = "$built" ]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        if: steps.freshness.outputs.build == 'true'
        run: |
          # lld: .cargo/config.toml links aarch64-unknown-linux-musl with -fuse-ld=lld.
          sudo apt-get update && sudo apt-get install -y musl-tools lld
          triple=${{ matrix.arch }}-unknown-linux-musl
          rustup target add "$triple"
          # The same separate, musl-linked build script/bundle-linux does.
          export "CC_$(echo "$triple" | tr '-' '_')"=musl-gcc
          cargo --config .cargo/bundle-config.toml build --release --target "$triple" --package remote_server
          gzip -c "target/$triple/release/remote-server" > "$ASSET.gz"
          printf '{"sha":"%s","built_at":"%s"}\n' "${{ steps.freshness.outputs.sha }}" \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > "$ASSET.json"

      - name: Publish
        if: steps.freshness.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Also under the build's commit, so a client that hasn't updated yet
          # still finds its own server; keep the last few of those.
          short=$(echo "${{ steps.freshness.outputs.sha }}" | cut -c1-7)
          cp "$ASSET.gz" "$ASSET-$short.gz"
          gh release upload quiet-ui-latest "$ASSET.gz" "$ASSET.json" "$ASSET-$short.gz" \
            --repo "$GITHUB_REPOSITORY" --clobber
          gh release view quiet-ui-latest --repo "$GITHUB_REPOSITORY" --json assets \
            -q ".assets | map(select(.name | test(\"^$ASSET-[0-9a-f]{7}\\\\.gz$\"))) | sort_by(.createdAt) | reverse | .[6:] | .[].name" |
            while read -r old; do
              gh release delete-asset quiet-ui-latest "$old" --repo "$GITHUB_REPOSITORY" --yes
            done
